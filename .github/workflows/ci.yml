name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository diff
        run: git diff --check

      - name: Type-check
        run: pnpm exec tsc --noEmit --incremental false

      - name: Lint
        run: pnpm lint

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build

      - name: Check Monad contract sizes
        run: pnpm check:contract-sizes

      - name: Test contracts (including the mainnet fork of the AUSD funding path)
        env:
          MONAD_RPC_URL: https://rpc.monad.xyz
        run: forge test --network monad

      - name: Run policy tests
        run: pnpm test:policy

      - name: Build application
        run: pnpm build
