name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # Read to find the mark a green pass left for a tree (a mark is an artifact of this repository), and to list the
  # paths a pull request changes.
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

# One pass was one job of 21 minutes, run twice on the same code: on the pull request, then again on main once it
# was merged (measured on 1 Oct 2026: 47 passes, 990 minutes, 431 of them on main). Since 2 Oct 2026:
#
# - three jobs side by side, the contracts, the policy tests, and the screens in a browser cut in two parts (three
#   until 2 Oct 2026: the policy tests are the longest job, so a third part bought no time and cost its own set-up);
#   and since 11 Oct 2026 two more beside them, each on a build of its own: the screens that make a gift, where a
#   gift contract is named, and the screens of the card way, where Rampnow's settings are;
# - a tree a green pass already walked is not walked again: the pass leaves a mark named after the tree it tested,
#   and the next pass on the same tree reads it and stops. A pull request is tested as merged into main, so the
#   commit main receives carries the same tree whenever the branch was up to date, and its pass is one job of seconds;
# - a change of documents alone does not walk the screens, and a change with no Solidity file and nothing that moves
#   money does not run forge (scripts/ci-scope.sh, which runs everything for a path it does not know).
jobs:
  scope:
    name: What this pass must do
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validated: ${{ steps.mark.outputs.validated }}
      tree: ${{ steps.mark.outputs.tree }}
      contracts: ${{ steps.changed.outputs.contracts }}
      browser: ${{ steps.changed.outputs.browser }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look for the mark of a green pass on this tree
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          # A lookup that fails found no mark, and a pass with no mark runs: the safe side.
          found=$(gh api "repos/$REPOSITORY/actions/artifacts?name=validated-$tree&per_page=10" --jq '[.artifacts[] | select(.expired == false)] | length' || echo 0)
          if [ "${found:-0}" -gt 0 ]; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
            echo "Tree $tree was walked by a green pass already: nothing runs again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "validated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read what the change touches
        id: changed
        if: steps.mark.outputs.validated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The paths a pull request changes, or the paths a push added to the branch, a renamed file under both its
          # names. Where they cannot be read (a first push, more than GitHub lists, a call that fails), no path is
          # given, and with no path everything runs.
          paths='.filename, (.previous_filename // empty)'
          if [ "$EVENT" = "pull_request" ]; then
            gh api --paginate "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" --jq ".[] | $paths" > changed.txt || : > changed.txt
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" --jq "if (.files | length) >= 300 then empty else (.files[] | $paths) end" > changed.txt || : > changed.txt
          else
            : > changed.txt
          fi
          bash scripts/ci-scope.sh < changed.txt | tee -a "$GITHUB_OUTPUT"
          { echo "Changed paths: $(wc -l < changed.txt | tr -d ' ')"; bash scripts/ci-scope.sh < changed.txt; } >> "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Contracts
    needs: scope
    if: needs.scope.outputs.validated != 'true' && needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build

      - name: Check Monad contract sizes
        run: pnpm check:contract-sizes

      - name: Test contracts (including the mainnet fork of the AUSD funding path)
        env:
          MONAD_RPC_URL: https://rpc.monad.xyz
        run: forge test --network monad

  policy:
    name: Policy tests
    needs: scope
    if: needs.scope.outputs.validated != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository diff
        run: git diff --check

      - name: Type-check
        run: pnpm exec tsc --noEmit --incremental false

      - name: Lint
        run: pnpm lint

      - name: Check consumer screens for forbidden words
        run: pnpm check:words

      - name: Run policy tests
        run: pnpm test:policy

  browser:
    name: Screens in a browser (${{ matrix.part }} of 2)
    needs: scope
    if: needs.scope.outputs.validated != 'true' && needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # In three parts a part took 6 to 7 minutes (measured 2 Oct 2026); in two each carries half the suite. One slow
    # download of the browser (6 minutes instead of 30 seconds, on 1 Oct 2026) cut a run that had failed nothing, so
    # the limit leaves room for one.
    timeout-minutes: 25
    strategy:
      matrix:
        part: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Install the browser used by the screen tests
        run: pnpm exec playwright install --with-deps chromium

      # Runs against the built app with no database. Most screens are measured with nobody signed in, the state
      # of every first visit. Two tests sign a passkey in, and a server signs nobody in without a session secret:
      # this one is made up for the run, protects nothing, and exists nowhere else.
      - name: Test the screens in a browser
        env:
          SESSION_SIGNING_SECRET: ci-only-session-secret-that-protects-nothing
        run: pnpm test:browser --shard=${{ matrix.part }}/2

  # The screens that make a gift, walked on a build that names a gift contract (11 Oct 2026). The build above names
  # none, and from such a build a creation is never sent: the tests that walk one stopped in silence on every pass, and
  # one of them had been failing since the card became a store the page reads. It is the path money takes. Here a
  # creation that is not sent is a failure (VIKY_BUILD_NAMES_A_CONTRACT, test/browser/gift-kit.ts). The address is the
  # third gift contract's, which the judges page prints; nothing is sent to it, each test stands in for the chain.
  making:
    name: Screens that make a gift
    needs: scope
    if: needs.scope.outputs.validated != 'true' && needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_GIFT_ESCROW_ADDRESS: "0x591d76863177E70FfcA2C793212d4715A367Ec70"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application, with a gift contract named
        run: pnpm build

      - name: Install the browser used by the screen tests
        run: pnpm exec playwright install --with-deps chromium

      # The specs that call `needsAContract`, every one of them (test/ci-scope.test.ts holds this list to the files).
      - name: Walk the screens that make a gift
        env:
          SESSION_SIGNING_SECRET: ci-only-session-secret-that-protects-nothing
          VIKY_BUILD_NAMES_A_CONTRACT: "1"
        run: pnpm test:browser card-kept-on-the-way-out card-payment-wait judge-credit-on-the-wait page-closed-while-making

  # The card way through Rampnow, walked on a build that names its settings as production does (11 Oct 2026): the way
  # in, its frame, the converter of its dollars, and the gift contract. Twenty-three tests need such a build, and no
  # pass made one: they stopped in silence, and the frame's own spec had gone on expecting an address in euros since the
  # frame was asked in the reader's money (#114). Nothing leaves for Rampnow: each test stands in for its page and its
  # quote, and no key of its account is set here.
  card:
    name: Screens of the card way
    needs: scope
    if: needs.scope.outputs.validated != 'true' && needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_GIFT_ESCROW_ADDRESS: "0x591d76863177E70FfcA2C793212d4715A367Ec70"
      NEXT_PUBLIC_RAMPNOW_WAY_IN: "on"
      NEXT_PUBLIC_RAMPNOW_FRAME: "on"
      NEXT_PUBLIC_USDC_ROUTER_ADDRESS: "0xf05449c8b868Ce1e6a0D7223e2ceCbbfD1498F9c"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application, with the card way switched on
        run: pnpm build

      - name: Install the browser used by the screen tests
        run: pnpm exec playwright install --with-deps chromium

      # The specs that ask for this build, every one of them (test/ci-scope.test.ts holds this list to the files).
      - name: Walk the screens of the card way
        env:
          SESSION_SIGNING_SECRET: ci-only-session-secret-that-protects-nothing
          VIKY_RAMPNOW_FRAME_BUILD: "1"
        run: pnpm test:browser pay-sheet rampnow-frame way-out

  validated:
    name: Mark the tree as walked
    needs: [scope, contracts, policy, browser, making, card]
    # Only after a pass where the policy tests ran and passed and nothing failed or was cut. A job the change did not
    # ask for is skipped, which is not a failure; a pass stopped by the mark leaves no second mark.
    if: ${{ always() && needs.scope.outputs.validated != 'true' && needs.policy.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the mark
        run: echo "${{ needs.scope.outputs.tree }}" > validated.txt

      - name: Keep the mark, named after the tree
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ needs.scope.outputs.tree }}
          path: validated.txt
          retention-days: 30
          if-no-files-found: error
